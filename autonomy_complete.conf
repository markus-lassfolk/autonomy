# Complete UCI Configuration for Autonomy Daemon
# This file contains all configuration options used throughout the codebase

# General daemon settings
config general 'general'
    option daemon_mode '1'                    # Run as daemon (0/1)
    option debug_mode '0'                     # Debug mode enabled (0/1)
    option log_level '2'                      # Log level (0=error, 1=warn, 2=info, 3=debug)
    option log_file '/var/log/autonomy.log'   # Log file path
    option pid_file_timeout '30'              # PID file timeout in seconds

# Network settings
config network 'network'
    option check_interval '30'                # Network check interval in seconds
    option failover_timeout '60'              # Failover timeout in seconds
    option auto_failover '1'                  # Auto failover enabled (0/1)
    option min_interface_health '50'          # Minimum interface health score
    option mwan3_integration '1'              # MWAN3 integration enabled (0/1)

# GPS settings
config gps 'gps'
    option update_interval '10'               # GPS update interval in seconds
    option timeout '30'                       # GPS timeout in seconds
    option fusion '1'                         # GPS fusion enabled (0/1)
    option cache_timeout '300'                # GPS cache timeout in seconds
    option min_accuracy '10.0'                # Minimum GPS accuracy in meters

# Starlink settings
config starlink 'starlink'
    option check_interval '30'                # Starlink check interval in seconds
    option health_monitoring '1'              # Starlink health monitoring (0/1)
    option host '192.168.100.1'               # Starlink host IP
    option port '9200'                        # Starlink port
    option timeout '10'                       # Starlink timeout in seconds

# System monitoring settings
config system 'system'
    option check_interval '60'                # System check interval in seconds
    option resource_monitoring '1'            # Resource monitoring enabled (0/1)
    option service_monitoring '1'             # Service monitoring enabled (0/1)
    option alert_threshold '80'               # Alert threshold percentage

# Notification settings
config notifications 'notifications'
    option enabled '1'                        # Notifications enabled (0/1)
    option email_from ''                      # Email from address
    option email_to ''                        # Email to address
    option email_smtp ''                      # SMTP server
    option webhook_url ''                     # Webhook URL

# Snow detection settings
config snow_detection 'snow_detection'
    option enabled '1'                        # Enable/disable snow detection (0/1)
    option detection_samples '5'              # Number of samples needed for detection
    option obstruction_threshold '0.05'       # Obstruction increase threshold (5%)
    option snr_degradation_threshold '0.02'   # SNR degradation threshold (2%)
    option temperature_threshold '2.0'        # Temperature threshold for snow detection (°C)
    option verification_time '300'            # Verification time in seconds (5 minutes)
    option melt_timeout '1800'                # Maximum melt time in seconds (30 minutes)
    option weather_api_key ''                 # OpenWeatherMap API key

# GPS Manager settings
config gps_manager 'gps_manager'
    option enabled '1'                        # GPS manager enabled (0/1)
    option update_interval '5'                # GPS update interval in seconds
    option source_timeout '60'                # GPS source timeout in seconds
    option min_reliability '0.3'              # Minimum reliability threshold
    option position_threshold '50.0'          # Position change threshold in meters

# GPS Terrain Analysis settings
config gps_terrain 'gps_terrain'
    option enabled '1'                        # Terrain analysis enabled (0/1)
    option max_cache_entries '2000'           # Maximum terrain cache entries
    option update_interval '3600'             # Terrain update interval in seconds
    option cache_radius '5000.0'              # Terrain cache radius in meters
    option max_elevation_points '100'         # Maximum elevation points per analysis
    option min_elevation_difference '1.0'     # Minimum elevation difference for analysis

# GPS Comprehensive settings
config gps_comprehensive 'gps_comprehensive'
    option enabled '1'                        # Comprehensive GPS enabled (0/1)
    option movement_threshold '50.0'          # Movement threshold in meters
    option fusion_method 'confidence_weighted' # Fusion method
    option precision_reduction '10.0'         # Precision reduction in meters

# Cellular Collector settings
config cellular_collector 'cellular_collector'
    option enabled '1'                        # Cellular collector enabled (0/1)
    option modem_device '/dev/ttyUSB0'        # Modem device path
    option collection_interval '30'           # Collection interval in seconds
    option timeout_seconds '10'               # Timeout in seconds
    option stability_monitoring '1'           # Stability monitoring enabled (0/1)

# Network Failover settings
config network_failover 'network_failover'
    option enabled '1'                        # Network failover enabled (0/1)
    option auto_failover '1'                  # Auto failover enabled (0/1)
    option health_threshold '70.0'            # Health threshold percentage
    option failover_threshold '50.0'          # Failover threshold percentage
    option failover_timeout '60'              # Failover timeout in seconds
    option recovery_timeout '300'             # Recovery timeout in seconds
    option check_interval '10'                # Check interval in seconds

# Network Discovery settings
config network_discovery 'network_discovery'
    option enabled '1'                        # Network discovery enabled (0/1)
    option discovery_interval '30'            # Discovery interval in seconds
    option interface_timeout '300'            # Interface timeout in seconds

# Network Collector settings
config network_collector 'network_collector'
    option enabled '1'                        # Network collector enabled (0/1)
    option collection_interval '30'           # Collection interval in seconds
    option test_targets '8.8.8.8,1.1.1.1,208.67.222.222,9.9.9.9' # Test targets (comma-separated)

# Network Controller settings
config network_controller 'network_controller'
    option enabled '1'                        # Network controller enabled (0/1)
    option use_mwan3 '1'                      # Use MWAN3 (0/1)

# WiFi Management settings
config wifi_management 'wifi_management'
    option enabled '1'                        # WiFi management enabled (0/1)
    option movement_threshold '100.0'         # Movement threshold in meters
    option max_channel_scores '100'           # Maximum channel scores to store
    option max_scheduled_tasks '50'           # Maximum scheduled tasks
    option max_wifi_interfaces '10'           # Maximum WiFi interfaces
    option default_noise_floor '-90'          # Default noise floor in dBm
    option vht80_threshold '-70'              # VHT80 threshold in dBm
    option vht40_threshold '-75'              # VHT40 threshold in dBm
    option strong_rssi_threshold '-60'        # Strong interferer threshold
    option weak_rssi_threshold '-80'          # Weak interferer threshold

# WiFi Enhanced settings
config wifi_enhanced 'wifi_enhanced'
    option enabled '1'                        # WiFi enhanced enabled (0/1)
    option regulatory_domain 'US'             # Regulatory domain (US/EU/WORLD)
    option channel_optimization '1'           # Channel optimization enabled (0/1)
    option interference_detection '1'         # Interference detection enabled (0/1)

# Starlink Comprehensive settings
config starlink_comprehensive 'starlink_comprehensive'
    option enabled '1'                        # Starlink comprehensive enabled (0/1)
    option collection_interval '30'           # Collection interval in seconds
    option diagnostics_timeout '10'           # Diagnostics timeout in seconds
    option history_timeout '15'               # History timeout in seconds

# Starlink Obstruction Analysis settings
config starlink_obstruction 'starlink_obstruction'
    option enabled '1'                        # Obstruction analysis enabled (0/1)
    option max_patterns '100'                 # Maximum environmental patterns
    option max_history_points '1440'          # Maximum history points (24 hours)
    option min_observations_to_learn '10'     # Minimum observations to learn pattern
    option pattern_similarity_threshold '0.7' # Pattern similarity threshold
    option location_radius_meters '1000.0'    # Location radius for pattern matching
    option max_active_matches '5'             # Maximum concurrent active matches
    option match_timeout_minutes '30'         # Timeout for active matches
    option history_size '100'                 # Number of match results to keep

# Starlink Snow Detection Integration settings
config starlink_snow_integration 'starlink_snow_integration'
    option enabled '1'                        # Snow detection integration enabled (0/1)
    option check_interval '30'                # Check interval in seconds
    option sample_interval '5'                # Sample interval in seconds
    option max_retries '3'                    # Maximum retry attempts

# Starlink API Version Monitor settings
config starlink_api_monitor 'starlink_api_monitor'
    option enabled '1'                        # API version monitor enabled (0/1)
    option monitor_interval '3600'            # Monitor interval in seconds
    option version_check_timeout '5'          # Version check timeout in seconds

# Telemetry Comprehensive settings
config telemetry_comprehensive 'telemetry_comprehensive'
    option enabled '1'                        # Telemetry comprehensive enabled (0/1)
    option collection_interval '60'           # Collection interval in seconds
    option database_path '/var/lib/autonomy/telemetry.db' # Database path
    option max_samples '10000'                # Maximum samples to store
    option cleanup_interval '3600'            # Cleanup interval in seconds

# Telemetry Store settings
config telemetry_store 'telemetry_store'
    option enabled '1'                        # Telemetry store enabled (0/1)
    option store_interval '300'               # Store interval in seconds
    option max_memory_usage '100'             # Maximum memory usage in MB
    option compression_enabled '1'            # Compression enabled (0/1)

# Predictive Engine settings
config predictive_engine 'predictive_engine'
    option enabled '1'                        # Predictive engine enabled (0/1)
    option prediction_horizon_hours '24'      # Prediction horizon in hours
    option confidence_threshold '0.7'         # Confidence threshold
    option enable_machine_learning '1'        # Machine learning enabled (0/1)
    option training_data_points '1000'        # Training data points
    option update_interval_seconds '3600'     # Update interval in seconds

# Notification Configuration settings
config notification_config 'notification_config'
    option enabled '1'                        # Notification configuration enabled (0/1)
    option email_enabled '0'                  # Email notifications enabled (0/1)
    option pushover_enabled '0'               # Pushover notifications enabled (0/1)
    option slack_enabled '0'                  # Slack notifications enabled (0/1)
    option discord_enabled '0'                # Discord notifications enabled (0/1)
    option webhook_enabled '0'                # Webhook notifications enabled (0/1)
    option telegram_enabled '0'               # Telegram notifications enabled (0/1)
    option sms_enabled '0'                    # SMS notifications enabled (0/1)

# Pushover Client settings
config pushover_client 'pushover_client'
    option enabled '0'                        # Pushover client enabled (0/1)
    option token ''                           # Pushover token
    option user_key ''                        # Pushover user key
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# Email Client settings
config email_client 'email_client'
    option enabled '0'                        # Email client enabled (0/1)
    option smtp_server ''                     # SMTP server
    option smtp_port '587'                    # SMTP port
    option username ''                        # SMTP username
    option password ''                        # SMTP password
    option from_address ''                    # From address
    option to_address ''                      # To address
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# Slack Client settings
config slack_client 'slack_client'
    option enabled '0'                        # Slack client enabled (0/1)
    option webhook_url ''                     # Slack webhook URL
    option channel ''                         # Slack channel
    option username 'Autonomy'                # Slack username
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# Discord Client settings
config discord_client 'discord_client'
    option enabled '0'                        # Discord client enabled (0/1)
    option webhook_url ''                     # Discord webhook URL
    option username 'Autonomy'                # Discord username
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# Webhook Client settings
config webhook_client 'webhook_client'
    option enabled '0'                        # Webhook client enabled (0/1)
    option url ''                             # Webhook URL
    option method 'POST'                      # HTTP method
    option content_type 'application/json'    # Content type
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# Telegram Client settings
config telegram_client 'telegram_client'
    option enabled '0'                        # Telegram client enabled (0/1)
    option bot_token ''                       # Telegram bot token
    option chat_id ''                         # Telegram chat ID
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# SMS Client settings
config sms_client 'sms_client'
    option enabled '0'                        # SMS client enabled (0/1)
    option provider 'twilio'                  # SMS provider
    option account_sid ''                     # Account SID
    option auth_token ''                      # Auth token
    option from_number ''                     # From number
    option to_number ''                       # To number
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# UnwiredLabs API settings
config unwiredlabs_api 'unwiredlabs_api'
    option enabled '0'                        # UnwiredLabs API enabled (0/1)
    option api_token ''                       # UnwiredLabs API token
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# OpenCellID API settings
config opencellid_api 'opencellid_api'
    option enabled '0'                        # OpenCellID API enabled (0/1)
    option api_key ''                         # OpenCellID API key
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# Google Places API settings
config google_places_api 'google_places_api'
    option enabled '0'                        # Google Places API enabled (0/1)
    option api_key ''                         # Google Places API key
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# NASA MODIS API settings
config nasa_modis_api 'nasa_modis_api'
    option enabled '0'                        # NASA MODIS API enabled (0/1)
    option api_key ''                         # NASA MODIS API key
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# USGS Web Soil Survey API settings
config usgs_soil_api 'usgs_soil_api'
    option enabled '0'                        # USGS Soil API enabled (0/1)
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# OpenWeatherMap API settings
config openweathermap_api 'openweathermap_api'
    option enabled '0'                        # OpenWeatherMap API enabled (0/1)
    option api_key ''                         # OpenWeatherMap API key
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts

# Space-Track.org API settings
config spacetrack_api 'spacetrack_api'
    option enabled '0'                        # Space-Track API enabled (0/1)
    option username ''                        # Space-Track username
    option password ''                        # Space-Track password
    option timeout_seconds '30'               # Timeout in seconds
    option retry_attempts '3'                 # Retry attempts
