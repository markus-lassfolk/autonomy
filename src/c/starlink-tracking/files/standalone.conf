# Starlink Standalone Client Configuration
# This file contains default configuration for the standalone client

# Space-Track.org credentials (required for TLE data)
space_track_username=""
space_track_password=""

# Starlink dish connection settings
starlink_dish_ip="192.168.1.1"
starlink_dish_port=9200

# Update intervals (in minutes)
update_interval_minutes=15
prediction_horizon_hours=24

# Tracking parameters
min_elevation_degrees=25.0
obstruction_threshold=0.1

# Validation and caching
validation_enabled=true
cache_duration_hours=6
rate_limit_requests_per_minute=10

# Standalone-specific options
config_file="/etc/starlink-standalone/standalone.conf"
log_file="/var/log/starlink-standalone.log"
cache_directory="/tmp/starlink-standalone-cache"
http_api_port=8080
enable_web_interface=true
log_level=1  # 0=debug, 1=info, 2=warn, 3=error
