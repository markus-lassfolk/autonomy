# UCI Configuration for Starlink Snow Detection System
# This file defines the configuration options for the snow detection system

config snow_detection 'snow_detection'
    option enabled '1'                    # Enable/disable snow detection (0/1)
    option detection_samples '5'          # Number of samples needed for detection
    option obstruction_threshold '0.05'   # Obstruction increase threshold (5%)
    option snr_degradation_threshold '0.02' # SNR degradation threshold (2%)
    option temperature_threshold '2.0'    # Temperature threshold for snow detection (°C)
    option verification_time '300'        # Verification time in seconds (5 minutes)
    option melt_timeout '1800'            # Maximum melt time in seconds (30 minutes)

# Configuration explanation:
# - enabled: Master switch for the snow detection system
# - detection_samples: Number of consecutive obstruction samples needed to trigger detection
# - obstruction_threshold: Rate of obstruction increase that indicates snow accumulation
# - snr_degradation_threshold: Rate of SNR degradation that indicates signal issues
# - temperature_threshold: Below this temperature, snow is more likely
# - verification_time: Time to wait before confirming obstruction type
# - melt_timeout: Maximum time to run heating before giving up

# Example usage:
# uci set autonomy.snow_detection.enabled='1'
# uci set autonomy.snow_detection.detection_samples='3'
# uci set autonomy.snow_detection.obstruction_threshold='0.03'
# uci commit autonomy
